# AMBIENTE DE DESENVOLVIMENTO

# MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3306/db_pontuo?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Logs SQL para desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS - Desenvolvimento
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
