spring.application.name=api-pontuo
spring.datasource.url=jdbc:mariadb://localhost:3306/db_pontuo?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# Autenticacao JWT. O segredo nunca fica no repositorio: precisa vir da
# variavel de ambiente JWT_SECRET (arquivo .env) com no minimo 32 caracteres.
# Sem ela a aplicacao nao sobe, para evitar rodar com uma chave conhecida.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=api-pontuo
security.jwt.expiration-minutes=120