
spring.application.name=api-pontuo

# Ambiente ativo: desenvolvimento
# Para producao, utilizar SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Codificacao
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=api-pontuo
security.jwt.expiration-minutes=120

# Swagger UI em /swagger-ui.html, exibindo a especificacao escrita a mao em
# static/openapi.yaml no lugar da gerada automaticamente. O api-docs precisa
# ficar ligado: sem ele o springdoc nao registra o Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true

# Porta de execucao (Render utiliza PORT)
server.port=${PORT:8080}
server.address=0.0.0.0
