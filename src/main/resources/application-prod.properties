# AMBIENTE DE PRODUCAO

# MariaDB Cloud
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:db_pontuo}?sslMode=verify-full&serverSslCert=classpath:certificates/globalsignrootca.pem
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS - Producao
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Flyway e JWT sao herdados de application.properties