  /api/questions:
    get:
      tags:
        - "Questões"
      operationId: listQuestions
      summary: "Buscar questões (paginado)"
      description: |-
        Todos os filtros são opcionais e se combinam em AND. O resultado é ordenado por `id`, então nenhuma questão aparece em duas páginas.

        A `explanation` (resolução comentada) só é preenchida para o administrador.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/questions?entranceExamId=1&knowledgeAreaId=1&page=0&size=20" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - name: entranceExamId
          in: query
          required: false
          description: "Questões do vestibular."
          schema:
            type: integer
            format: int64
          example: 1
        - name: knowledgeAreaId
          in: query
          required: false
          description: "Questões da área do conhecimento (pela matéria da questão ou do tópico dela)."
          schema:
            type: integer
            format: int64
          example: 1
        - name: subjectId
          in: query
          required: false
          description: "Questões da matéria (pela própria questão ou pelo tópico dela)."
          schema:
            type: integer
            format: int64
          example: 1
        - name: topicId
          in: query
          required: false
          description: "Questões do tópico."
          schema:
            type: integer
            format: int64
          example: 1
        - name: difficulty
          in: query
          required: false
          description: "Nível de dificuldade, de 1 (fácil) a 3 (difícil)."
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3
          example: 2
        - name: page
          in: query
          required: false
          description: "Número da página, a partir de 0."
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: "Tamanho da página, de 1 a 100."
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Página de questões, ordenada por `id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionPage"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                size: size deve estar entre 1 e 100
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                vestibular:
                  summary: Vestibular do filtro inexistente
                  value:
                    message: "EntranceExam não encontrado: id=99"
                area:
                  summary: "Área do filtro inexistente"
                  value:
                    message: "KnowledgeArea não encontrada: id=99"
                materia:
                  summary: "Matéria do filtro inexistente"
                  value:
                    message: "Subject não encontrada: id=99"
                topico:
                  summary: "Tópico do filtro inexistente"
                  value:
                    message: "Topic não encontrado: id=99"
    post:
      tags:
        - "Questões"
      operationId: createQuestion
      summary: "Cadastrar questão"
      description: |-
        A questão é classificada por **tópico ou matéria**: informe exatamente um entre `topicId` e `subjectId` (`409` se vierem os dois ou nenhum).

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/questions" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"statement": "Durante a divisão celular, qual processo garante...", "explanation": "A mitose mantém o número de cromossomos...", "difficulty": 2, "entranceExamId": 1, "topicId": 1, "subjectId": null}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
            example:
              statement: "Durante a divisão celular, qual processo garante..."
              explanation: "A mitose mantém o número de cromossomos..."
              difficulty: 2
              entranceExamId: 1
              topicId: 1
              subjectId: null
      responses:
        "201":
          description: "Questão criada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                difficulty: difficulty deve estar entre 1 e 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                vestibular:
                  summary: Vestibular inexistente
                  value:
                    message: "EntranceExam não encontrado: id=99"
                topico:
                  summary: "Tópico inexistente"
                  value:
                    message: "Topic não encontrado: id=99"
                materia:
                  summary: "Matéria inexistente"
                  value:
                    message: "Subject não encontrada: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                nenhum:
                  summary: "Sem tópico nem matéria"
                  value:
                    message: informe topicId ou subjectId
                ambos:
                  summary: "Tópico e matéria juntos"
                  value:
                    message: "informe topicId ou subjectId, não os dois"
