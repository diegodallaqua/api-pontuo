        Altera `name`, `numQuestions`, `maxTime` e, opcionalmente, o dono (`userId`, só administrador). Recusado (`409`) depois de finalizado, depois do prazo (`startedAt + maxTime`), ao mudar `maxTime` após o início ou ao reduzir `numQuestions` abaixo das questões já vinculadas.

        **Acesso:** usuário autenticado. O estudante só acessa os próprios registros (`403` nos de outra pessoa); o administrador acessa todos.

        **Exemplo cURL**

        ```bash
        curl -X PUT "http://localhost:8080/api/mock-exams/1" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Simulado ENEM - Natureza", "numQuestions": 10, "maxTime": 90}'
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockExamRequest"
            example:
              name: Simulado ENEM - Natureza
              numQuestions: 10
              maxTime: 90
      responses:
        "200":
          description: Simulado atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockExamResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                name: "name é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Perfil sem permissão ou simulado de outro usuário."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                dono:
                  summary: "Simulado de outro usuário"
                  value:
                    message: "Acesso negado: o registro pertence a outro usuário."
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "MockExam não encontrado: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                finalizado:
                  summary: Simulado finalizado
                  value:
                    message: "simulado já finalizado não pode ser alterado: id=1"
                prazo:
                  summary: Prazo encerrado
                  value:
                    message: "prazo do simulado encerrado: id=1"
                maxTime:
                  summary: "maxTime após início"
                  value:
                    message: "maxTime não pode ser alterado após o início: id=1"
                numQuestions:
                  summary: numQuestions abaixo do vinculado
                  value:
                    message: "numQuestions não pode ser menor que as questões já vinculadas: 8"
    delete:
      tags:
        - Simulados
      operationId: deleteMockExam
      summary: Excluir simulado
      description: |-
        Permitido em qualquer etapa, inclusive depois de finalizado. Leva as respostas junto.

        **Acesso:** usuário autenticado. O estudante só acessa os próprios registros (`403` nos de outra pessoa); o administrador acessa todos.

        **Exemplo cURL**

        ```bash
        curl -X DELETE "http://localhost:8080/api/mock-exams/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "Simulado e respostas excluídos. Sem corpo."
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Perfil sem permissão ou simulado de outro usuário."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                dono:
                  summary: "Simulado de outro usuário"
                  value:
                    message: "Acesso negado: o registro pertence a outro usuário."
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "MockExam não encontrado: id=99"
