  /api/users/{id}:
    get:
      tags:
        - "Usuários"
      operationId: getUser
      summary: "Buscar usuário por id"
      description: |-
        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/users/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "Usuário encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - "Usuários"
      operationId: updateUser
      summary: "Atualizar usuário"
      description: |-
        Atualiza o usuário informado. O corpo substitui todos os campos.

        A senha é gravada com BCrypt e nunca volta na resposta.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X PUT "http://localhost:8080/api/users/1" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"username": "maria", "email": "maria@email.com", "birthDate": "2007-03-15", "password": "senhaSegura123", "userRoleId": 2}'
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              username: maria
              email: "maria@email.com"
              birthDate: "2007-03-15"
              password: senhaSegura123
              userRoleId: 2
      responses:
        "200":
          description: "Usuário atualizado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                password: password deve ter entre 8 e 72 caracteres
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                self:
                  summary: "Usuário inexistente"
                  value:
                    message: "User não encontrado: id=99"
                fk:
                  summary: Registro relacionado inexistente
                  value:
                    message: "UserRole não encontrada: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                username:
                  summary: Username em uso
                  value:
                    message: "username já cadastrado: maria"
                email:
                  summary: Email em uso
                  value:
                    message: "email já cadastrado: maria@email.com"
    delete:
      tags:
        - "Usuários"
      operationId: deleteUser
      summary: "Excluir usuário"
      description: |-
        Usuário com simulados não pode ser excluído.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X DELETE "http://localhost:8080/api/users/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "Usuário excluído. Sem corpo."
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "User não encontrado: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Operação recusada: o registro está em uso por outros dados ou já existe."
