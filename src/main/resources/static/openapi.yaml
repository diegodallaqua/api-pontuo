# Especificação OpenAPI da API Pontuo, servida em /openapi.yaml e exibida no
# Swagger UI (/swagger-ui.html). Ao criar ou alterar um endpoint, atualize
# este arquivo: OpenApiSpecTest falha se uma rota ficar de fora.
openapi: "3.0.3"
info:
  title: API Pontuo
  version: "0.0.1"
  description: |-
    API REST do **Pontuo**, plataforma de preparação para vestibulares: catálogo de instituições,
    vestibulares, matérias, tópicos e questões, e simulados respondidos pelos estudantes.

    ## Autenticação

    A API é stateless e autenticada por JWT. Fluxo:

    1. `POST /api/auth/register` cria uma conta de **Estudante** (rota pública).
    2. `POST /api/auth/login` devolve o `accessToken` (rota pública).
    3. As demais rotas exigem o header `Authorization: Bearer <token>`. No Swagger UI, clique em **Authorize** e cole o token.
    4. `POST /api/auth/logout` revoga o token.

    O servidor das chamadas feitas pelo "Try it out" é escolhido no seletor **Servers**: ambiente local
    (`http://localhost:8080`) ou produção (`https://api-pontuo.onrender.com`). Os exemplos cURL usam o
    ambiente local; para produção, troque a URL base.

    Os exemplos cURL usam a variável de shell `$TOKEN`:

    ```bash
    TOKEN=$(curl -s -X POST "http://localhost:8080/api/auth/login" \
      -H "Content-Type: application/json" \
      -d '{"username": "maria", "password": "senhaSegura123"}' | jq -r .accessToken)
    ```

    ## Perfis

    | Rota | Estudante | Administrador |
    |---|---|---|
    | `GET` no catálogo | leitura | leitura |
    | `POST`/`PUT`/`DELETE` no catálogo | `403` | permitido |
    | `/api/mock-exams/**`, `/api/mock-exam-questions/**` | só os próprios (`403` nos de outro) | todos |
    | `/api/performance/me/**` | próprio desempenho | próprio desempenho |
    | `/api/performance/users/**` | `403` | qualquer usuário |
    | `/api/users/**`, `/api/user-roles/**` | `403` | permitido |

    O gabarito (`rightAnswer`) e a resolução (`explanation`) não são enviados ao estudante antes da finalização do simulado.

    ## Erros

    | Status | Quando | Corpo |
    |---|---|---|
    | `400` | Corpo, parâmetro de query ou id do path inválido (zero, negativo ou não numérico) | Uma mensagem por campo: `{"name": "name é obrigatório"}`, `{"id": "id deve ser maior que zero"}` |
    | `400` | JSON malformado ou com campo no tipo errado | `{"message": "..."}` |
    | `401` | Sem token, token inválido/expirado/revogado, ou login incorreto | `{"message": "..."}` |
    | `403` | Perfil sem permissão, ou registro de outro usuário | `{"message": "..."}` |
    | `404` | Registro ou registro relacionado não encontrado, ou rota inexistente | `{"message": "Address não encontrado: id=99"}` |
    | `405` | Método HTTP não aceito pela rota | `{"message": "..."}`, com os métodos aceitos e o header `Allow` |
    | `409` | Regra de negócio violada ou registro em uso | `{"message": "..."}` |
    | `415` | `Content-Type` diferente de `application/json` | `{"message": "..."}` |
    | `500` | Erro inesperado no servidor | `{"message": "Erro interno inesperado. Tente novamente mais tarde."}` |

    Datas usam ISO-8601: `2026-10-28` para datas e `2026-10-28T14:30:00` (hora local do servidor, sem fuso) para data e hora.
servers:
  - url: "http://localhost:8080"
    description: Ambiente local
  - url: "https://api-pontuo.onrender.com"
    description: Produção (Render)
security:
  - bearerAuth: []
tags:
  - name: "Autenticação"
    description: "Cadastro, login, logout e usuário logado."
  - name: Estados
    description: "Estados (UF) usados nos endereços."
  - name: Cidades
    description: Cidades de cada estado.
  - name: "Endereços"
    description: "Endereços das instituições."
  - name: "Instituições"
    description: "Instituições que aplicam vestibulares."
  - name: Vestibulares
    description: Vestibulares e suas etapas.
  - name: "Áreas do conhecimento"
    description: "Grandes áreas (ex.: Ciências da Natureza)."
  - name: "Matérias"
    description: "Matérias de cada área do conhecimento."
  - name: "Tópicos"
    description: "Tópicos de cada matéria."
  - name: "Questões"
    description: "Questões de múltipla escolha: busca paginada, sorteio e cadastro."
  - name: Alternativas
    description: "Alternativas (A a E) de cada questão."
  - name: "Imagens de questões"
    description: Imagens que acompanham o enunciado.
  - name: Simulados
    description: "Ciclo de vida do simulado: criar, iniciar, finalizar e consultar o boletim."
  - name: "Questões do simulado"
    description: "Questões vinculadas a um simulado e as respostas do estudante."
  - name: Desempenho
    description: "Análise de desempenho sobre os simulados finalizados."
  - name: "Usuários"
    description: "Gestão de usuários (administrador)."
  - name: "Perfis de usuário"
    description: Perfis de acesso (administrador).
paths:
  /api/auth/register:
    post:
      tags:
        - "Autenticação"
      operationId: register
      summary: Criar conta de estudante
      description: |-
        Cadastro público. O perfil é sempre `Estudante`, definido pelo servidor — o corpo não aceita `userRoleId`.

        **Acesso:** público (sem token).

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/auth/register" \
          -H "Content-Type: application/json" \
          -d '{"username": "maria", "email": "maria@email.com", "birthDate": "2007-03-15", "password": "senhaSegura123"}'
        ```
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: maria
              email: "maria@email.com"
              birthDate: "2007-03-15"
              password: senhaSegura123
      responses:
        "201":
          description: "Conta criada com o perfil `Estudante`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                email: "email deve ser válido"
                password: password deve ter entre 8 e 72 caracteres
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                username:
                  summary: Username em uso
                  value:
                    message: "username já cadastrado: maria"
                email:
                  summary: Email em uso
                  value:
                    message: "email já cadastrado: maria@email.com"
  /api/auth/login:
    post:
      tags:
        - "Autenticação"
      operationId: login
      summary: Fazer login
      description: |-
        Troca usuário e senha por um JWT (HS256). `username` aceita o username ou o email. Envie o `accessToken` nas demais rotas no header `Authorization: Bearer <token>`.

        Para guardar o token no shell:

        ```bash
        TOKEN=$(curl -s -X POST "http://localhost:8080/api/auth/login" \
          -H "Content-Type: application/json" \
          -d '{"username": "maria", "password": "senhaSegura123"}' | jq -r .accessToken)
        ```

        **Acesso:** público (sem token).

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/auth/login" \
          -H "Content-Type: application/json" \
          -d '{"username": "maria", "password": "senhaSegura123"}'
        ```
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: maria
              password: senhaSegura123
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                password: "password é obrigatório"
        "401":
          description: "Usuário ou senha incorretos. A mensagem é genérica de propósito."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Credenciais inválidas."
  /api/auth/logout:
    post:
      tags:
        - "Autenticação"
      operationId: logout
      summary: Fazer logout
      description: |-
        Revoga o token usado na requisição. Depois disso ele responde `401` em qualquer rota, mesmo antes de expirar.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/auth/logout" \
          -H "Authorization: Bearer $TOKEN"
        ```
      responses:
        "204":
          description: Token revogado. Sem corpo.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me:
    get:
      tags:
        - "Autenticação"
      operationId: me
      summary: "Dados do usuário logado"
      description: |-
        Devolve o usuário dono do token, sem a senha.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/auth/me" \
          -H "Authorization: Bearer $TOKEN"
        ```
      responses:
        "200":
          description: "Usuário dono do token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "User não encontrado: username=maria"
  /api/states:
    get:
      tags:
        - Estados
      operationId: listStates
      summary: Listar estados
      description: |-
        Lista estados.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/states" \
          -H "Authorization: Bearer $TOKEN"
        ```
      responses:
        "200":
          description: Lista de estados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Estados
      operationId: createState
      summary: Cadastrar estado
      description: |-
        Cadastra um estado.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/states" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Santa Catarina"}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateRequest"
            example:
              name: Santa Catarina
      responses:
        "201":
          description: Estado criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                name: "name é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/states/{id}:
    get:
      tags:
        - Estados
      operationId: getState
      summary: Buscar estado por id
      description: |-
        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/states/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Estado encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Estados
      operationId: updateState
      summary: Atualizar estado
      description: |-
        Atualiza o estado informado. O corpo substitui todos os campos.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X PUT "http://localhost:8080/api/states/1" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Santa Catarina"}'
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateRequest"
            example:
              name: Santa Catarina
      responses:
        "200":
          description: Estado atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                name: "name é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                self:
                  summary: Estado inexistente
                  value:
                    message: "State não encontrada: id=99"
    delete:
      tags:
        - Estados
      operationId: deleteState
      summary: Excluir estado
      description: |-
        Estado com cidades vinculadas não pode ser excluído.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X DELETE "http://localhost:8080/api/states/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "Estado excluído. Sem corpo."
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "State não encontrada: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Operação recusada: o registro está em uso por outros dados ou já existe."
  /api/cities:
    get:
      tags:
        - Cidades
      operationId: listCitys
      summary: Listar cidades
      description: |-
        Lista cidades.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/cities?stateId=1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - name: stateId
          in: query
          required: false
          description: Lista apenas as cidades do estado informado.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Lista de cidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "State não encontrado: id=99"
    post:
      tags:
        - Cidades
      operationId: createCity
      summary: Cadastrar cidade
      description: |-
        Cadastra uma cidade.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/cities" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Florianópolis", "stateId": 1}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityRequest"
            example:
              name: "Florianópolis"
              stateId: 1
      responses:
        "201":
          description: Cidade criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                stateId: "stateId é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "State não encontrado: id=99"
  /api/cities/{id}:
    get:
      tags:
        - Cidades
      operationId: getCity
      summary: Buscar cidade por id
      description: |-
        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/cities/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cidade encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Cidades
      operationId: updateCity
      summary: Atualizar cidade
      description: |-
        Atualiza a cidade informada. O corpo substitui todos os campos.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X PUT "http://localhost:8080/api/cities/1" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Florianópolis", "stateId": 1}'
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityRequest"
            example:
              name: "Florianópolis"
              stateId: 1
      responses:
        "200":
          description: Cidade atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                stateId: "stateId é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                self:
                  summary: Cidade inexistente
                  value:
                    message: "City não encontrada: id=99"
                fk:
                  summary: Registro relacionado inexistente
                  value:
                    message: "State não encontrado: id=99"
    delete:
      tags:
        - Cidades
      operationId: deleteCity
      summary: Excluir cidade
      description: |-
        Cidade com endereços vinculados não pode ser excluída.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X DELETE "http://localhost:8080/api/cities/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "Cidade excluída. Sem corpo."
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "City não encontrada: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Operação recusada: o registro está em uso por outros dados ou já existe."
  /api/addresses:
    get:
      tags:
        - "Endereços"
      operationId: listAddresss
      summary: "Listar endereços"
      description: |-
        Lista endereços.

        **Acesso:** qualquer usuário autenticado (estudante ou administrador).

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/addresses?cityId=1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - name: cityId
          in: query
          required: false
          description: "Lista apenas os endereços da cidade informada."
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: "Lista de endereços."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "City não encontrada: id=99"
    post:
      tags:
        - "Endereços"
      operationId: createAddress
      summary: "Cadastrar endereço"
      description: |-
        Cadastra um endereço.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/addresses" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"street": "Rua Desembargador Vitor Lima", "neighborhood": "Trindade", "number": 222, "complement": "Reitoria II", "cityId": 1}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
            example:
              street: Rua Desembargador Vitor Lima
              neighborhood: Trindade
