    post:
      tags:
        - "Usuários"
      operationId: createUser
      summary: "Cadastrar usuário"
      description: |-
        Cadastra um usuário.

        A senha é gravada com BCrypt e nunca volta na resposta.

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/users" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"username": "maria", "email": "maria@email.com", "birthDate": "2007-03-15", "password": "senhaSegura123", "userRoleId": 2}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              username: maria
              email: "maria@email.com"
              birthDate: "2007-03-15"
              password: senhaSegura123
              userRoleId: 2
      responses:
        "201":
          description: "Usuário criado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                password: password deve ter entre 8 e 72 caracteres
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "UserRole não encontrada: id=99"
        "409":
