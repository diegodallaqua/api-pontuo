  /api/mock-exams:
    get:
      tags:
        - Simulados
      operationId: listMockExams
      summary: Listar simulados
      description: |-
        Sem `userId`, o administrador vê todos os simulados e o estudante, só os dele. Com `userId`, o estudante só pode informar o próprio id.

        **Acesso:** usuário autenticado. O estudante só acessa os próprios registros (`403` nos de outra pessoa); o administrador acessa todos.

        **Exemplo cURL**

        ```bash
        curl -X GET "http://localhost:8080/api/mock-exams" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - name: userId
          in: query
          required: false
          description: "Lista apenas os simulados do usuário."
          schema:
            type: integer
            format: int64
          example: 7
      responses:
        "200":
          description: Lista de simulados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockExamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Perfil sem permissão ou simulado de outro usuário."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                dono:
                  summary: "Simulado de outro usuário"
                  value:
                    message: "Acesso negado: o registro pertence a outro usuário."
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "User não encontrado: id=99"
    post:
      tags:
        - Simulados
      operationId: createMockExam
      summary: Criar simulado
      description: |-
        Sem `userId`, o dono é o usuário do token; só o administrador cria para outra pessoa. Início, fim, acertos e aproveitamento são definidos pelo servidor — se enviados, são ignorados.

        **Acesso:** usuário autenticado. O estudante só acessa os próprios registros (`403` nos de outra pessoa); o administrador acessa todos.

        **Exemplo cURL**

        ```bash
        curl -X POST "http://localhost:8080/api/mock-exams" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Simulado ENEM - Natureza", "numQuestions": 10, "maxTime": 90}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockExamRequest"
            example:
              name: Simulado ENEM - Natureza
              numQuestions: 10
              maxTime: 90
      responses:
        "201":
          description: "Simulado criado, ainda não iniciado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockExamResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                numQuestions: numQuestions deve ser maior que zero
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Estudante tentando criar simulado para outra pessoa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Acesso negado: o estudante só cria simulados para si mesmo."
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "User não encontrado: id=99"
