components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token obtido em `POST /api/auth/login`. Informe só o token, sem o prefixo `Bearer`."
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: "Id do registro (inteiro maior que zero)."
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    UserId:
      name: userId
      in: path
      required: true
      description: "Id do usuário (inteiro maior que zero)."
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7
    From:
      name: from
      in: query
      required: false
      description: "Data inicial (inclusiva), sobre a finalização do simulado."
      schema:
        type: string
        format: date
      example: "2026-09-01"
    To:
      name: to
      in: query
      required: false
      description: "Data final (inclusiva), sobre a finalização do simulado."
      schema:
        type: string
        format: date
      example: "2026-10-31"
  responses:
    Unauthorized:
      description: "Sem token, ou token inválido, expirado ou revogado pelo logout. A resposta traz o header `WWW-Authenticate: Bearer`."
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            message: "Autenticação necessária: envie um token válido no header Authorization."
    Forbidden:
      description: "Perfil sem permissão para o recurso."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            message: "Acesso negado: seu perfil não tem permissão para este recurso."
    NotFound:
      description: "Registro não encontrado. A mensagem diz qual registro e qual id."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            message: "Address não encontrado: id=99"
    InvalidId:
      description: "Id do path inválido: zero, negativo ou não numérico. A chave é o nome do parâmetro (`id` ou `userId`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrors"
          examples:
            naoPositivo:
              summary: Id zero ou negativo
              value:
                id: "id deve ser maior que zero"
            naoNumerico:
              summary: Id não numérico
              value:
                id: "id deve ser um número inteiro (recebido: abc)"
  schemas:
    ErrorMessage:
      type: object
      description: "Erro de autenticação, autorização, recurso não encontrado ou regra de negócio."
      required:
        - message
      properties:
        message:
          type: string
          example: "Credenciais inválidas."
    ValidationErrors:
      type: object
      description: "Erros de validação: cada chave é o campo (ou parâmetro de query) e o valor, a mensagem."
      additionalProperties:
        type: string
      example:
        name: "name é obrigatório"
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username ou email.
          example: maria
        password:
          type: string
          format: password
          example: senhaSegura123
    LoginResponse:
      type: object
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJhcGktcG9udHVvIiwic3ViIjoibWFyaWEifQ.sig
        expiresIn:
          type: integer
          format: int64
          example: 7200
          description: Validade do token em segundos.
        user:
          $ref: "#/components/schemas/UserResponse"
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - birthDate
        - password
      properties:
        username:
          type: string
          maxLength: 60
          example: maria
        email:
          type: string
          format: email
          maxLength: 160
          example: "maria@email.com"
        birthDate:
          type: string
          format: date
          description: Data no passado.
          example: "2007-03-15"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
    UserRoleRequest:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          maxLength: 50
          example: Estudante
    UserRoleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        description:
          type: string
          example: Estudante
    UserRequest:
      type: object
      required:
        - username
        - email
        - birthDate
        - password
        - userRoleId
      properties:
        username:
          type: string
          maxLength: 60
          example: maria
        email:
          type: string
          format: email
          maxLength: 160
          example: "maria@email.com"
        birthDate:
          type: string
          format: date
          description: Data no passado.
          example: "2007-03-15"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
        userRoleId:
          type: integer
          format: int64
          example: 2
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 7
        username:
          type: string
          example: maria
        email:
          type: string
          example: "maria@email.com"
        birthDate:
          type: string
          format: date
          example: "2007-03-15"
        createdAt:
          type: string
          description: "Data e hora local do servidor (ISO-8601, sem fuso)."
          example: "2026-10-01T09:15:00"
        userRole:
          $ref: "#/components/schemas/UserRoleResponse"
    StateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Santa Catarina
    StateResponse:
      type: object
      properties:
        id:
          type: integer
