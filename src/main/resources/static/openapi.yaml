    put:
      tags:
        - "Questões"
      operationId: updateQuestion
      summary: "Atualizar questão"
      description: |-
        A questão é classificada por **tópico ou matéria**: informe exatamente um entre `topicId` e `subjectId` (`409` se vierem os dois ou nenhum).

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X PUT "http://localhost:8080/api/questions/1" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"statement": "Durante a divisão celular, qual processo garante...", "explanation": "A mitose mantém o número de cromossomos...", "difficulty": 2, "entranceExamId": 1, "topicId": 1, "subjectId": null}'
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
            example:
              statement: "Durante a divisão celular, qual processo garante..."
              explanation: "A mitose mantém o número de cromossomos..."
              difficulty: 2
              entranceExamId: 1
              topicId: 1
              subjectId: null
      responses:
        "200":
          description: "Questão atualizada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "400":
          description: "Corpo ou parâmetro inválido. Uma mensagem por campo com erro."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                statement: "statement é obrigatório"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                self:
                  summary: "Questão inexistente"
                  value:
                    message: "Question não encontrada: id=99"
                vestibular:
                  summary: Vestibular inexistente
                  value:
                    message: "EntranceExam não encontrado: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                nenhum:
                  summary: "Sem tópico nem matéria"
                  value:
                    message: informe topicId ou subjectId
                ambos:
                  summary: "Tópico e matéria juntos"
                  value:
                    message: "informe topicId ou subjectId, não os dois"
    delete:
      tags:
        - "Questões"
      operationId: deleteQuestion
      summary: "Excluir questão"
      description: |-
        Questão que já está em algum simulado não pode ser excluída (`409`).

        **Acesso:** somente administrador.

        **Exemplo cURL**

        ```bash
        curl -X DELETE "http://localhost:8080/api/questions/1" \
          -H "Authorization: Bearer $TOKEN"
        ```
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: "Questão excluída. Sem corpo."
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Registro (ou registro relacionado) não encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Question não encontrada: id=99"
        "409":
          description: "Regra de negócio violada ou registro em uso."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Operação recusada: o registro está em uso por outros dados ou já existe."
