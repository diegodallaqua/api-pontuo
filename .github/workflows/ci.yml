name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # Banco vazio a cada execução: o Flyway cria a estrutura desde a V1, então os
    # testes com @RequiresDatabase também rodam aqui. Credenciais só valem para a CI.
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: db_pontuo
          MARIADB_USER: db_pontuo
          MARIADB_PASSWORD: senha-apenas-para-ci
          MARIADB_ROOT_PASSWORD: root-apenas-para-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O mvnw está versionado sem permissão de execução (commit feito no Windows).
      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # O MariaDB 12.3 cria o banco com utf8mb4_uca1400_ai_ci, mas as tabelas das
      # migrations usam utf8mb4_unicode_ci. As tabelas temporárias das migrations
      # (V12, V13, V15) herdam a collation do banco e quebram o JOIN com
      # "Illegal mix of collations". O README manda criar o banco com
      # utf8mb4_unicode_ci; aqui fazemos o mesmo.
      - name: Ajustar collation do banco
        run: >
          mysql -h 127.0.0.1 -P 3306 -u root -proot-apenas-para-ci
          -e "ALTER DATABASE db_pontuo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Testes
        run: ./mvnw -B verify
        env:
          DB_USERNAME: db_pontuo
          DB_PASSWORD: senha-apenas-para-ci
          JWT_SECRET: segredo-apenas-para-ci-com-mais-de-32-bytes
