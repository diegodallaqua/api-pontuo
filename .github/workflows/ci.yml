name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O mvnw está versionado sem permissão de execução (commit feito no Windows).
      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # Sem MariaDB e sem .env na CI: os testes marcados com @RequiresDatabase são
      # pulados e os @Pendente só rodam com -Dpontuo.pendentes=true.
      - name: Testes
        run: ./mvnw -B verify
